name: Outdated

on:
  schedule:
    - cron: '15 6 10 * *'
  workflow_dispatch:

permissions: {}

jobs:
  outdated:
    name: Check outdated
    runs-on: ubuntu-latest
    steps:
      # The default GITHUB_TOKEN doesn't trigger workflows on the PRs it
      # creates, so CI would never run on them. Use a GitHub App token instead.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Runs no Elixir, so no third-party code ever runs next to the App token.
      - name: Check outdated public suffix list
        run: .github/workflows/outdated.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
