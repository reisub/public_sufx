name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{matrix.name}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: OTP 26.2.5.21 / Elixir 1.15.0
            otp: "26.2.5.21"
            elixir: "1.15.0"
          - name: OTP / Elixir from mise.toml
            version-file: mise.toml
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Erlang & Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # Either explicit versions or a version file, setup-beam ignores the empty ones
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
          version-file: ${{matrix.version-file}}
          version-type: strict

      - name: Cache mix dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install mix dependencies
        run: mix deps.get

      - name: Check warnings
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

      - name: Check docs
        run: mix doctor

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Erlang & Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache mix dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-lint-

      - name: Install mix dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Check version script matches mix.exs
        run: |
          # mix run may print compiler output first, the version is the last line
          expected=$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])' | tail -n 1)
          actual=$(.github/workflows/version.sh)
          echo "mix.exs: $expected, version.sh: $actual"
          test "$expected" = "$actual"
